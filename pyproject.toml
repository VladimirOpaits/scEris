[project]
name = "sceris"
version = "0.1.0"
description = "Group-balanced retrieval de-confounding for cross-dataset single-cell cohorts"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "diptest",
    "rich",
]

[project.scripts]
sceris = "sceris.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sceris"]
